name: Release

# Official releases only. This does NOT run on every push to main — only
# when you push a version tag, e.g.:
#
#   git tag v1.1.0
#   git push origin v1.1.0
#
# Before tagging, bump pubspec.yaml's `version:` to match (see build.yml's
# "Suggest next version" step summary for what the next version should be).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tag matches pubspec.yaml version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} doesn't match pubspec.yaml version ${PUBSPEC_VERSION}. Update pubspec.yaml, commit, then re-tag."
            exit 1
          fi

      - name: Run tests
        run: flutter test

      - name: Set up Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/invois-release.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=invois-release.jks
          EOF

      - name: Compute version
        id: version
        shell: bash
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          # Build number (Android versionCode) is derived from the CI run
          # number, NOT from pubspec.yaml's "+N" suffix. That suffix requires
          # a human to remember to bump it every release, and history shows
          # that doesn't reliably happen (v1.0.1 and v1.1.0 both shipped as
          # "+1" — identical versionCode — which is why devices couldn't
          # install the update: Android refuses a same-or-lower versionCode
          # regardless of the version *name* changing). github.run_number
          # always increases, so this can't regress the same way again.
          CODE="${{ github.run_number }}"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}

      - name: Rename APK
        run: |
          mkdir -p build/app/outputs/flutter-apk/renamed

          cp build/app/outputs/flutter-apk/app-release.apk \
          build/app/outputs/flutter-apk/renamed/invois-${{ github.ref_name }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: invois-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Invois ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/renamed/invois-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
