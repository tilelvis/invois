name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # needed to publish a GitHub Release with the APK attached

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Set up release signing
        # Only runs if the KEYSTORE_BASE64 secret has been configured (see
        # android/SIGNING.md). Without it, the build falls back to Flutter's
        # debug signing, matching the previous behavior.
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/invois-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=invois-release.jks
          EOF

      - name: Compute version
        id: version
        run: |
          # versionName comes from pubspec.yaml (e.g. "1.0.0" from "1.0.0+1"),
          # bump this by hand when you ship a real feature/release.
          # versionCode is the GitHub Actions run number, which always goes up —
          # so you never have to think about it, and every build can install
          # over the last one without a "downgrade" conflict.
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}

      - name: Rename APK with version
        run: |
          mkdir -p build/app/outputs/flutter-apk/renamed
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/renamed/invois-${{ steps.version.outputs.tag }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        # Anyone "Watching" this repo with notifications set to "Releases only"
        # gets an automatic email / GitHub notification the moment this runs —
        # no Play Store, no extra service needed.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Invois ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/renamed/invois-${{ steps.version.outputs.tag }}.apk
