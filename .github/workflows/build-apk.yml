name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/invois-release.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=invois-release.jks
          EOF

      - name: Compute version
        id: version
        shell: bash
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}

      - name: Rename APK
        run: |
          mkdir -p build/app/outputs/flutter-apk/renamed

          cp build/app/outputs/flutter-apk/app-release.apk \
          build/app/outputs/flutter-apk/renamed/invois-${{ steps.version.outputs.tag }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: invois-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Invois ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/renamed/invois-${{ steps.version.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
